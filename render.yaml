services:
  - type: web
    name: felt-poker
    runtime: node
    plan: free
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      # NOTE: do NOT set NODE_ENV=production here. Render applies env vars
      # during the build step too, and npm treats NODE_ENV=production as a
      # signal to skip devDependencies on install — which breaks the build,
      # since Tailwind/TypeScript (needed to compile the app) live there.
      # The start script sets NODE_ENV=production itself at runtime instead.
      - key: NODE_VERSION
        value: 22.11.0
